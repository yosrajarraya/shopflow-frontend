<nav class="navbar" [class.scrolled]="scrolled">
  <div class="container nav-inner">
    <!-- Brand -->
    <a routerLink="/" class="brand">
      <span class="brand-icon">◆</span>
      <span class="brand-name">ShopFlow</span>
    </a>

    <!-- Nav Links -->
    <ul class="nav-links" [class.open]="menuOpen">
      <li><a routerLink="/products" [class.active]="isCatalogue" (click)="menuOpen=false">Catalogue</a></li>
      <li><a routerLink="/products" [queryParams]="{promo:true}" [class.active]="isPromo" (click)="menuOpen=false">Promotions</a></li>
      <li *ngIf="currentUser?.role === 'CUSTOMER'">
        <a [routerLink]="dashboardRoute" routerLinkActive="active" (click)="menuOpen=false">Mon espace</a>
      </li>
      <li *ngIf="currentUser?.role === 'ADMIN'">
        <a [routerLink]="dashboardRoute" routerLinkActive="active" (click)="menuOpen=false">Dashboard</a>
      </li>
      <li *ngIf="currentUser?.role === 'SELLER'">
        <a [routerLink]="dashboardRoute" routerLinkActive="active" (click)="menuOpen=false">Mon espace</a>
      </li>
    </ul>

    <!-- Nav Actions -->
    <div class="nav-actions">
      <a routerLink="/products" class="nav-icon-btn" title="Rechercher">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </a>

      <!-- Cart (customer only) -->
      <a *ngIf="currentUser?.role === 'CUSTOMER'" routerLink="/cart" class="nav-icon-btn cart-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" *ngIf="cartCount$ | async as cartCount">{{ cartCount }}</span>
      </a>

      <!-- Authenticated -->
      <div *ngIf="currentUser; else authButtons" class="user-menu" [class.open]="userMenuOpen">
        <button type="button" class="user-btn" (click)="toggleUserMenu($event)">
          <span class="user-avatar">{{ currentUser.nom.charAt(0) }}</span>
          <span class="user-name hide-mobile">{{ currentUser.nom }}</span>
        </button>
        <div class="user-dropdown">
          <a routerLink="/profile" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mon Profil
          </a>
          <a [routerLink]="dashboardRoute" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Tableau de bord
          </a>
          <a *ngIf="currentUser.role === 'ADMIN'" routerLink="/admin/users" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Utilisateurs
          </a>
          <a *ngIf="currentUser.role === 'ADMIN'" routerLink="/admin/reviews" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Modération avis
          </a>
          <a *ngIf="currentUser.role === 'ADMIN'" routerLink="/admin/coupons" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            Coupons
          </a>
          <a *ngIf="currentUser.role === 'ADMIN'" routerLink="/categories" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Catégories
          </a>
          <a *ngIf="currentUser.role === 'CUSTOMER'" routerLink="/orders" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            Mes commandes
          </a>
          <a *ngIf="currentUser.role === 'SELLER'" routerLink="/products/new" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            Ajouter un produit
          </a>
          <a *ngIf="currentUser.role === 'SELLER'" routerLink="/seller/products" class="dropdown-item" (click)="closeUserMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
            </svg>
            Mes produits
          </a>
          <div class="dropdown-divider"></div>
          <button type="button" (click)="logout()" class="dropdown-item danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>

      <ng-template #authButtons>
        <a routerLink="/auth/login" class="btn btn-ghost btn-sm hide-mobile">Connexion</a>
        <a routerLink="/auth/register" class="btn btn-primary btn-sm">S'inscrire</a>
      </ng-template>

      <!-- Mobile toggle -->
      <button class="mobile-toggle" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
