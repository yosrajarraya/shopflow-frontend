<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="brand-icon">◆</span>
      <span class="brand-name">ShopFlow</span>
      <p>La marketplace premium tunisienne.</p>
    </div>
    <div class="footer-links">
      <div class="footer-col">
        <h5>Catalogue</h5>
        <ul>
          <li><a routerLink="/products">Tous les produits</a></li>
          <li><a routerLink="/products" [queryParams]="{promo:true}">Promotions</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h5>Compte</h5>
        <ul>
          <li><a routerLink="/auth/login">Connexion</a></li>
          <li><a routerLink="/auth/register">Inscription</a></li>
          <li><a routerLink="/orders">Mes commandes</a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© {{ year }} ShopFlow. Tous droits réservés.</p>
  </div>
</footer>
