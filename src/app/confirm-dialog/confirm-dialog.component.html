<h2 mat-dialog-title>Confirmer la suppression</h2>
<mat-dialog-content>Cette action est irréversible. Voulez-vous continuer ?</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button [mat-dialog-close]="true" color="warn">Supprimer</button>
</mat-dialog-actions>
