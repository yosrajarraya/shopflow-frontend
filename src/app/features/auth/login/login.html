<div class="auth-page">
  <div class="auth-card animate-fade">
    <div class="auth-brand">
      <span class="brand-icon">◆</span>
      <span class="brand-name">ShopFlow</span>
    </div>
    <h1>Connexion</h1>
    <p class="auth-subtitle">Accédez à votre espace personnel</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="vous@exemple.com" />
        <span class="error-msg" *ngIf="email.invalid && email.touched">
          {{ email.errors?.['required'] ? 'Email requis.' : 'Email invalide.' }}
        </span>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-with-icon">
          <input [type]="showPass ? 'text' : 'password'" formControlName="motDePasse"
                 class="form-control" placeholder="••••••••" />
          <button type="button" class="pass-toggle" (click)="showPass = !showPass">
            {{ showPass ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-msg" *ngIf="motDePasse.invalid && motDePasse.touched">
          Mot de passe requis (min. 6 caractères).
        </span>
        <a routerLink="/auth/forgot-password" class="forgot-password-link">Mot de passe oublié?</a>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" [disabled]="loading">
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading" class="spin-dot">...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Pas encore de compte ?
        <a routerLink="/auth/register">S'inscrire</a>
      </p>
    </div>
  </div>
</div>
